    <polygon points="46,91 56,118 4,162" fill="#2a74e6"/>
  </g>
  <g font-family="Segoe UI, Montserrat, Arial, sans-serif" text-anchor="middle">
    <text x="160" y="250" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="1">DART<tspan fill="url(#accent)">SOL</tspan></text>
    <text x="160" y="278" font-size="11.5" font-weight="600" fill="#b9c8ef" letter-spacing="3.5">TECHNOLOGY WITH DIRECTION</text>
