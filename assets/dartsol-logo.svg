  </defs>
  <rect width="320" height="320" rx="36" fill="url(#bg)"/>
  <rect x="1" y="1" width="318" height="318" rx="35" fill="none" stroke="#2f8bff" stroke-opacity="0.5" stroke-width="2"/>
  <g transform="translate(108 46)" filter="url(#glow)">
