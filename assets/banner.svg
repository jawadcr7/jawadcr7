<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <radialGradient id="bg" cx="0.75" cy="0.2" r="1">
      <stop offset="0" stop-color="#0b2a6b"/>
      <stop offset="0.55" stop-color="#06123a"/>
      <stop offset="1" stop-color="#030820"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f8bff"/>
      <stop offset="1" stop-color="#3fd0ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d4fb8" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- glowing arcs -->
  <g fill="none" stroke="#2f8bff" filter="url(#glow)">
    <path d="M820 340 C 900 120, 1100 40, 1300 60" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M760 340 C 880 160, 1080 100, 1300 130" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- dart logo -->
  <g transform="translate(70 92) scale(0.95)">
    <polygon points="8,67 100,0 46,91" fill="#3a63d6"/>
    <polygon points="46,91 100,0 101,107 66,147" fill="#5596f5"/>
    <polygon points="8,67 46,91 0,118" fill="#2a2f8f"/>
    <polygon points="46,91 56,118 4,162" fill="#2a74e6"/>
  </g>
  <rect x="183" y="96" width="2" height="128" fill="#3f6bff" opacity="0.8"/>

  <!-- wordmark -->
  <g font-family="Segoe UI, Montserrat, Arial, sans-serif">
    <text x="210" y="168" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="2">DART<tspan fill="url(#accent)">SOL</tspan></text>
    <text x="214" y="204" font-size="17" font-weight="600" fill="#b9c8ef" letter-spacing="7">TECHNOLOGY WITH DIRECTION</text>
  </g>

  <!-- right side: what we build -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="600">
    <g transform="translate(790 70)">
      <rect width="420" height="48" rx="24" fill="#071a4a" stroke="#2f8bff" stroke-width="1.5" filter="url(#glow)"/>
      <text x="210" y="31" text-anchor="middle" font-size="19" fill="#ffffff">⚡ AI Automation &amp; Agents</text>
    </g>
    <g transform="translate(790 136)">
      <rect width="420" height="48" rx="24" fill="#071a4a" stroke="#2f8bff" stroke-width="1.5" filter="url(#glow)"/>
      <text x="210" y="31" text-anchor="middle" font-size="19" fill="#ffffff">🎬 Video &amp; Content Pipelines</text>
    </g>
    <g transform="translate(790 202)">
      <rect width="420" height="48" rx="24" fill="#071a4a" stroke="#2f8bff" stroke-width="1.5" filter="url(#glow)"/>
      <text x="210" y="31" text-anchor="middle" font-size="19" fill="#ffffff">🚀 Full-Stack Web &amp; SaaS</text>
    </g>
  </g>

  <rect y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
